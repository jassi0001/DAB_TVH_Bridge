# Home Assistant package: FM v2 (API-native bridge, fm_bridge2.py) fuer den
# Sundtek-Stick auf dem Wohnwagen-LibreELEC (192.168.0.200).
#
# Laeuft PARALLEL zu fm_scan.yaml/fm_bridge.py (Port 8083, unveraendert) -
# fm_bridge2.py (Port 8093) unterscheidet sich nur durch natives Streaming
# (die Bridge haelt selbst genau einen ffmpeg-Prozess statt TVHeadend
# eigene pipe://-Prozesse spawnen zu lassen). RDS lief schon in v1 direkt
# ueber die SDK-API, das aendert sich hier nicht.

rest_command:
  fm2_trigger_rescan:
    url: "http://192.168.0.200:8093/fm/rescan"
    method: POST
    timeout: 10
  fm2_trigger_scan_new_location:
    url: "http://192.168.0.200:8093/fm/scan_new_location?name={{ name | urlencode }}"
    method: POST
    timeout: 10
  fm2_trigger_activate:
    url: "http://192.168.0.200:8093/fm/activate?name={{ name | urlencode }}"
    method: POST
    timeout: 10
  fm2_trigger_delete_location:
    url: "http://192.168.0.200:8093/fm/delete_location?name={{ name | urlencode }}"
    method: POST
    timeout: 10
  fm2_trigger_exclude:
    url: "http://192.168.0.200:8093/fm/exclude?name={{ name | urlencode }}&excluded={{ excluded }}"
    method: POST
    timeout: 10
  fm2_trigger_rename:
    url: "http://192.168.0.200:8093/fm/rename?raw_name={{ raw_name | urlencode }}&display_name={{ display_name | urlencode }}"
    method: POST
    timeout: 10

rest:
  - resource: "http://192.168.0.200:8093/fm/status"
    scan_interval: 15
    sensor:
      - name: "FM v2 Scan Status"
        unique_id: fm2_scan_status
        value_template: >-
          {% if value_json.running or value_json.tvh_scanning %}scanning
          {%- elif value_json.returncode == 0 %}idle
          {%- elif value_json.returncode is not none %}error
          {%- else %}unbekannt
          {%- endif %}
        json_attributes:
          - running
          - returncode
          - station_count
          - tvheadend_muxes
          - fm_scanning
          - fm_scan_current_freq
          - fm_scan_current_stations
          - fm_last_scan_freq
          - fm_last_scan_stations
          - tvh_mux_scan_pending
          - tvh_mux_scan_active
          - tvh_scanning
          - active_location
          - locations
          - log_tail
      - name: "FM v2 Senderanzahl"
        unique_id: fm2_station_count
        value_template: "{{ value_json.station_count }}"
        unit_of_measurement: "Sender"
      - name: "FM v2 Aktiver Standort"
        unique_id: fm2_active_location
        value_template: "{{ value_json.active_location or 'live (kein gespeicherter Standort)' }}"
  - resource: "http://192.168.0.200:8093/fm/stations"
    scan_interval: 30
    sensor:
      - name: "FM v2 Sender Liste"
        unique_id: fm2_sender_liste
        value_template: "{{ value_json.stations | length }}"
        unit_of_measurement: "Sender"
        json_attributes:
          - stations
  - resource: "http://192.168.0.200:8093/fm/signal"
    scan_interval: 15
    sensor:
      - name: "FM v2 Signalstaerke"
        unique_id: fm2_signal
        value_template: "{{ value_json.signal if value_json.signal is not none else 'unbekannt' }}"
        json_attributes:
          - device
          - signal
  - resource: "http://192.168.0.200:8093/fm/now_playing"
    scan_interval: 10
    sensor:
      - name: "FM v2 Aktueller Sender"
        unique_id: fm2_now_playing
        value_template: "{{ value_json.playing | join(', ') if value_json.playing else 'nichts aktiv' }}"
  - resource: "http://192.168.0.200:8093/fm/rds"
    scan_interval: 5
    sensor:
      - name: "FM v2 RDS Sendername"
        unique_id: fm2_rds_ps
        value_template: "{{ value_json.ps or 'kein RDS' }}"
        json_attributes:
          - ps
          - radiotext
          - pi
          - pty
          - updated_at
  - resource: "http://192.168.0.200:8093/fm/favorites"
    scan_interval: 60
    sensor:
      - name: "FM v2 Favoriten"
        unique_id: fm2_favoriten
        value_template: "{{ value_json.stations | length }}"
        unit_of_measurement: "Sender"
        json_attributes:
          - stations

input_select:
  fm2_location_to_activate:
    name: "FM v2 gespeicherter Standort"
    options:
      - "(noch keine geladen)"
  fm2_sender_auswahl:
    name: "FM v2 Sender auswaehlen"
    options:
      - "(noch keine geladen)"

input_text:
  fm2_sender_neuer_name:
    name: "FM v2 Sender: neuer Anzeigename"
    initial: ""

script:
  fm2_rescan:
    alias: "FM v2 Sender neu scannen (ca. 2-3 Min)"
    icon: mdi:radio-fm
    sequence:
      - service: rest_command.fm2_trigger_rescan

  fm2_scan_new_location:
    alias: "FM v2 neuen Standort scannen (ca. 2-3 Min)"
    icon: mdi:radio-fm
    sequence:
      - action: rest_command.fm2_trigger_scan_new_location
        data:
          name: "{{ states('input_text.neuer_standort_name') }}"

  fm2_activate_location:
    alias: "FM v2 gespeicherten Standort aktivieren"
    icon: mdi:map-marker-radius
    sequence:
      - action: rest_command.fm2_trigger_activate
        data:
          name: "{{ states('input_select.fm2_location_to_activate') }}"

  fm2_delete_location:
    alias: "FM v2 gespeicherten Standort loeschen"
    icon: mdi:delete
    sequence:
      - action: rest_command.fm2_trigger_delete_location
        data:
          name: "{{ states('input_select.fm2_location_to_activate') }}"

  fm2_sender_ausschliessen:
    alias: "FM v2 Sender ausschliessen"
    sequence:
      - action: rest_command.fm2_trigger_exclude
        data:
          name: "{{ states('input_select.fm2_sender_auswahl') }}"
          excluded: true

  fm2_sender_einschliessen:
    alias: "FM v2 Sender wieder einschliessen"
    sequence:
      - action: rest_command.fm2_trigger_exclude
        data:
          name: "{{ states('input_select.fm2_sender_auswahl') }}"
          excluded: false

  fm2_sender_umbenennen:
    alias: "FM v2 Sender umbenennen"
    sequence:
      - action: rest_command.fm2_trigger_rename
        data:
          raw_name: "{{ states('input_select.fm2_sender_auswahl') }}"
          display_name: "{{ states('input_text.fm2_sender_neuer_name') }}"

automation:
  - alias: "FM v2 Standort-Dropdown befuellen"
    trigger:
      - platform: state
        entity_id: sensor.fm_v2_scan_status
    action:
      - service: input_select.set_options
        target:
          entity_id: input_select.fm2_location_to_activate
        data:
          options: >-
            {% set locs = state_attr('sensor.fm_v2_scan_status', 'locations') or [] %}
            {% if locs | length == 0 %}
            ["(noch keine geladen)"]
            {% else %}
            {{ locs | map(attribute='name') | list | tojson }}
            {% endif %}

  - alias: "FM v2 Sender-Dropdown befuellen"
    trigger:
      - platform: state
        entity_id: sensor.fm_v2_sender_liste
    action:
      - service: input_select.set_options
        target:
          entity_id: input_select.fm2_sender_auswahl
        data:
          options: >-
            {% set stations = state_attr('sensor.fm_v2_sender_liste', 'stations') or [] %}
            {% if stations | length == 0 %}
            ["(noch keine geladen)"]
            {% else %}
            {{ stations | map(attribute='display_name') | list | tojson }}
            {% endif %}

  - alias: "FM v2 Umbenennen-Feld vorbefuellen"
    trigger:
      - platform: state
        entity_id: input_select.fm2_sender_auswahl
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.fm2_sender_neuer_name
        data:
          value: "{{ trigger.to_state.state }}"
