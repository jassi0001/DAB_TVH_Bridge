# Home Assistant package: DAB+ (Bridge dab_bridge2.py, Port 8091) fuer den
# Sundtek-Stick auf dem Wohnwagen-LibreELEC (192.168.0.200). Cover-Art/DLS
# werden direkt ueber die Sundtek-SDK-API gelesen, TVHeadend besitzt und
# streamt selbst per pipe://ffmpeg (siehe ARCHITECTURE.md).
#
# DAB+ und FM (fm_scan.yaml) teilen sich denselben physischen Tuner und
# schliessen sich deshalb beim Scannen/Streamen gegenseitig aus (siehe
# ARCHITECTURE.md) - der GPS-Standortwechsel-Automatismus unten loest
# deshalb bewusst nur einen DAB+-Rescan aus, keinen FM-Rescan.

rest_command:
  dab2_trigger_rescan:
    url: "http://192.168.0.200:8091/dab/rescan"
    method: POST
    timeout: 10
  dab2_trigger_scan_new_location:
    url: "http://192.168.0.200:8091/dab/scan_new_location?name={{ name | urlencode }}"
    method: POST
    timeout: 10
  dab2_trigger_activate_location:
    url: "http://192.168.0.200:8091/dab/activate?name={{ name | urlencode }}"
    method: POST
    timeout: 10
  dab2_trigger_exclude:
    # name/raw_name arrive pre-encoded from the calling script (dot ->
    # %2E) as a defensive measure against a live-confirmed HA templating
    # bug (see fm2_scan.yaml's matching rest_command for the full
    # explanation) - do NOT run them through | urlencode again here, that
    # would double-encode the already-literal "%2E" into "%252E". DAB+
    # station names are never purely numeric today, but this costs
    # nothing and removes the same latent risk.
    url: "http://192.168.0.200:8091/dab/exclude?name={{ name }}&excluded={{ excluded }}"
    method: POST
    timeout: 10
  dab2_trigger_rename:
    url: "http://192.168.0.200:8091/dab/rename?raw_name={{ raw_name }}&display_name={{ display_name | urlencode }}"
    method: POST
    timeout: 10
  dab2_trigger_delete_location:
    url: "http://192.168.0.200:8091/dab/delete_location?name={{ name | urlencode }}"
    method: POST
    timeout: 10

rest:
  - resource: "http://192.168.0.200:8091/dab/status"
    scan_interval: 15
    sensor:
      - name: "DAB+ v2 Scan Status"
        unique_id: dab2_scan_status
        value_template: >-
          {% if value_json.running or value_json.tvh_scanning %}scanning
          {%- elif value_json.returncode == 0 %}idle
          {%- elif value_json.returncode is not none %}error
          {%- else %}unbekannt
          {%- endif %}
        json_attributes:
          - running
          - returncode
          - station_count
          - tvheadend_muxes
          - dab_scanning
          - dab_scan_current_freq
          - dab_scan_current_stations
          - dab_last_scan_freq
          - dab_last_scan_stations
          - dab_last_scan_finished_at
          - tvh_mux_scan_pending
          - tvh_mux_scan_active
          - tvh_scanning
          - active_location
          - locations
          - log_tail
      - name: "DAB+ v2 Senderanzahl"
        unique_id: dab2_station_count
        value_template: "{{ value_json.station_count }}"
        unit_of_measurement: "Sender"
      - name: "TVHeadend DAB+ v2 Kanaele"
        unique_id: dab2_tvheadend_muxes
        value_template: "{{ value_json.tvheadend_muxes }}"
        unit_of_measurement: "Kanaele"
      - name: "DAB+ v2 Aktiver Standort"
        unique_id: dab2_active_location
        value_template: "{{ value_json.active_location or 'live (kein gespeicherter Standort)' }}"
  - resource: "http://192.168.0.200:8091/dab/stations"
    scan_interval: 30
    sensor:
      - name: "DAB+ v2 Sender Liste"
        unique_id: dab2_sender_liste
        value_template: "{{ value_json.stations | length }}"
        unit_of_measurement: "Sender"
        json_attributes:
          - stations
  - resource: "http://192.168.0.200:8091/dab/signal"
    scan_interval: 20
    sensor:
      - name: "DAB+ v2 Ensemble"
        unique_id: dab2_ensemble
        value_template: "{{ value_json.ensemble or 'unbekannt' }}"
        json_attributes:
          - locked
          - rssi
          - snr
          - fic_quality
          - cnr
          - device
          - sid
          - service_name
          - frequency
      - name: "DAB+ v2 Tuner Lock"
        unique_id: dab2_tuner_lock
        value_template: "{{ 'locked' if value_json.locked else 'kein Empfang' }}"
  - resource: "http://192.168.0.200:8091/dab/now_playing"
    scan_interval: 10
    sensor:
      - name: "DAB+ v2 Aktueller Sender"
        unique_id: dab2_now_playing
        value_template: "{{ value_json.playing | join(', ') if value_json.playing else 'nichts aktiv' }}"
  - resource: "http://192.168.0.200:8091/dab/now_playing_text"
    scan_interval: 5
    sensor:
      - name: "DAB+ v2 Sendungsinfo (DLS)"
        unique_id: dab2_dls_text
        value_template: "{{ value_json.text or 'kein Text' }}"
        json_attributes:
          - text
          - updated_at
          - channel
  - resource: "http://192.168.0.200:8091/dab/artwork_info"
    scan_interval: 10
    sensor:
      - name: "DAB+ v2 Sender Cover Status"
        unique_id: dab2_artwork_status
        value_template: >-
          {% if not value_json.available %}kein Cover
          {%- else %}{{ value_json.type }} ({{ value_json.channel }})
          {%- endif %}
        json_attributes:
          - available
          - updated_at
          - channel
          - type

input_select:
  dab2_location_to_activate:
    name: "DAB+ v2 gespeicherter Standort"
    options:
      - "(noch keine geladen)"
  dab2_sender_auswahl:
    name: "DAB+ v2 Sender auswaehlen"
    options:
      - "(noch keine geladen)"

input_text:
  dab2_sender_neuer_name:
    name: "DAB+ v2 Sender: neuer Anzeigename"
    initial: ""

# GPS-Standortwechsel-Automatismus (Rescan bei laengerem Halt an neuem Ort) -
# siehe die Automatisierung "DAB+ v2 Rescan bei neuem Standort" unten fuer
# die Bedingungen. Nur fuer DAB+, nicht fuer FM (gemeinsamer physischer
# Tuner - ein GPS-getriggerter FM-Rescan wuerde mit einem laufenden DAB+-Scan
# kollidieren, siehe ARCHITECTURE.md).
input_number:
  dab2_last_scan_lat:
    name: "DAB+ v2 letzte Scan-Position (Breitengrad)"
    min: -90
    max: 90
    step: 0.000001
    mode: box
  dab2_last_scan_lon:
    name: "DAB+ v2 letzte Scan-Position (Laengengrad)"
    min: -180
    max: 180
    step: 0.000001
    mode: box

script:
  dab2_rescan:
    alias: "DAB+ v2 Sender neu scannen (ca. 2-3 Min)"
    icon: mdi:radio
    sequence:
      - service: rest_command.dab2_trigger_rescan

  dab2_scan_new_location:
    alias: "DAB+ v2 neuen Standort scannen (ca. 2-3 Min)"
    icon: mdi:radio
    sequence:
      - action: rest_command.dab2_trigger_scan_new_location
        data:
          name: "{{ states('input_text.neuer_standort_name') }}"

  dab2_activate_location:
    alias: "DAB+ v2 Standort aktivieren"
    icon: mdi:radio
    sequence:
      - action: rest_command.dab2_trigger_activate_location
        data:
          name: "{{ states('input_select.dab2_location_to_activate') }}"

  dab2_delete_location:
    alias: "DAB+ v2 Standort loeschen"
    icon: mdi:delete
    sequence:
      - action: rest_command.dab2_trigger_delete_location
        data:
          name: "{{ states('input_select.dab2_location_to_activate') }}"

  dab2_sender_ausschliessen:
    alias: "DAB+ v2 Sender ausschliessen"
    icon: mdi:radio-off
    sequence:
      - action: rest_command.dab2_trigger_exclude
        data:
          name: "{{ states('input_select.dab2_sender_auswahl') | replace('.', '%2E') }}"
          excluded: "true"

  dab2_sender_einschliessen:
    alias: "DAB+ v2 Sender wieder einschliessen"
    icon: mdi:radio
    sequence:
      - action: rest_command.dab2_trigger_exclude
        data:
          name: "{{ states('input_select.dab2_sender_auswahl') | replace('.', '%2E') }}"
          excluded: "false"

  dab2_sender_umbenennen:
    alias: "DAB+ v2 Sender umbenennen"
    icon: mdi:rename
    sequence:
      - action: rest_command.dab2_trigger_rename
        data:
          raw_name: "{{ states('input_select.dab2_sender_auswahl') | replace('.', '%2E') }}"
          display_name: "{{ states('input_text.dab2_sender_neuer_name') }}"

template:
  - sensor:
      - name: "DAB+ v2 Entfernung zum letzten Scan"
        unique_id: dab2_entfernung_letzter_scan
        unit_of_measurement: "km"
        state: >
          {% set lat1 = states('sensor.rutx50_gps_latitude') | float(none) %}
          {% set lon1 = states('sensor.rutx50_gps_longitude') | float(none) %}
          {% set lat2 = states('input_number.dab2_last_scan_lat') | float(0) %}
          {% set lon2 = states('input_number.dab2_last_scan_lon') | float(0) %}
          {{ (distance(lat1, lon1, lat2, lon2) | round(2)) if (lat1 is not none and lon1 is not none and lat2 and lon2) else 999 }}
      - name: "DAB+ v2 Sender Status (Auswahl)"
        unique_id: dab2_sender_status_auswahl
        state: >
          {% set sel = states('input_select.dab2_sender_auswahl') %}
          {% set stations = state_attr('sensor.dab_v2_sender_liste', 'stations') or [] %}
          {% set match = stations | selectattr('raw_name', 'eq', sel) | list %}
          {% if not match %}unbekannt
          {%- elif match[0].excluded %}ausgeschlossen
          {%- else %}aktiv ({{ match[0].display_name }})
          {%- endif %}

automation:
  - alias: "DAB+ v2 Standort-Dropdown synchronisieren"
    id: dab2_sync_location_dropdown
    triggers:
      - platform: state
        entity_id: sensor.dab_v2_scan_status
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/10"
    actions:
      - action: input_select.set_options
        target:
          entity_id: input_select.dab2_location_to_activate
        data:
          options: >
            {% set locs = (state_attr('sensor.dab_v2_scan_status', 'locations') or [])
                 | map(attribute='name') | list %}
            {{ locs if locs else ["(noch keine geladen)"] }}

  - alias: "DAB+ v2 Sender-Dropdown synchronisieren"
    id: dab2_sync_sender_dropdown
    triggers:
      - platform: state
        entity_id: sensor.dab_v2_sender_liste
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/10"
    actions:
      - action: input_select.set_options
        target:
          entity_id: input_select.dab2_sender_auswahl
        data:
          options: >
            {% set names = (state_attr('sensor.dab_v2_sender_liste', 'stations') or [])
                 | map(attribute='raw_name') | list %}
            {{ names if names else ["(noch keine geladen)"] }}

  - alias: "DAB+ v2 Sender: Anzeigename vorbefuellen"
    id: dab2_prefill_sender_name
    triggers:
      - platform: state
        entity_id: input_select.dab2_sender_auswahl
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.dab2_sender_neuer_name
        data:
          value: >
            {% set sel = states('input_select.dab2_sender_auswahl') %}
            {% set stations = state_attr('sensor.dab_v2_sender_liste', 'stations') or [] %}
            {% set match = stations | selectattr('raw_name', 'eq', sel) | list %}
            {{ match[0].display_name if match else sel }}

  - alias: "DAB+ v2 Rescan bei neuem Standort"
    id: dab2_rescan_on_location_change
    mode: single
    triggers:
      - platform: numeric_state
        entity_id: sensor.rutx50_gps_speed
        below: 3
        for:
          minutes: 40
    conditions:
      - condition: numeric_state
        entity_id: sensor.dab_v2_entfernung_zum_letzten_scan
        above: 0.5
    actions:
      - action: script.dab2_rescan
      - action: input_number.set_value
        target:
          entity_id: input_number.dab2_last_scan_lat
        data:
          value: "{{ states('sensor.rutx50_gps_latitude') }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.dab2_last_scan_lon
        data:
          value: "{{ states('sensor.rutx50_gps_longitude') }}"
