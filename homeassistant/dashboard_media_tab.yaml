# Auszug aus dem Lovelace-Dashboard: nur die DAB+/DVB-T-relevanten Karten
# aus dem "Media"-Tab (persoenliche/unrelated Karten wie der Media-Player
# selbst sind hier bewusst weggelassen). Als eigene View oder in eine
# bestehende View einfuegen.

cards:
  - type: tile
    entity: sensor.dvb_t_status
    name: DVB-T Scan Status
  - type: tile
    entity: sensor.dvb_t_aktives_netzwerk
    name: DVB-T Aktiver Standort
  - type: tile
    entity: sensor.dvb_t_senderanzahl
    name: DVB-T Senderanzahl
  - type: entities
    title: DVB-T Empfang (live)
    entities:
      - entity: sensor.dvb_t_empfang
        name: Status
      - type: attribute
        entity: sensor.dvb_t_empfang
        attribute: stream
        name: Aktueller Stream
      - type: attribute
        entity: sensor.dvb_t_empfang
        attribute: snr_db
        name: "SNR (dB, falls verfuegbar)"
      - type: attribute
        entity: sensor.dvb_t_empfang
        attribute: snr
        name: "SNR (Rohwert, falls Skala unbekannt)"
      - type: attribute
        entity: sensor.dvb_t_empfang
        attribute: signal_db
        name: "Signalstaerke (dB, falls verfuegbar)"
      - type: attribute
        entity: sensor.dvb_t_empfang
        attribute: unc
        name: "Unkorrigierte Bloecke"
    footer:
      type: markdown
      content: >
        *Nur waehrend ein Kanal aktiv gestreamt wird verfuegbar - im
        Leerlauf zeigt TVHeadend keine sinnvollen Werte.*
  - type: entities
    title: DVB-T Standort aktivieren
    entities:
      - entity: input_select.dvbt_network_to_activate
        name: Gespeicherter Standort
  - type: button
    entity: script.dvbt_activate_network
    name: DVB-T Standort aktivieren
    icon: mdi:antenna
  - type: button
    entity: script.dvbt_delete_network
    name: DVB-T Standort loeschen
    icon: mdi:delete
    tap_action:
      action: call-service
      service: script.turn_on
      target:
        entity_id: script.dvbt_delete_network
      confirmation:
        text: "Ausgewaehltes DVB-T-Netzwerk wirklich loeschen? Das kann nicht rueckgaengig gemacht werden."
  - type: entities
    title: Neuer Standort (fuer DVB-T; DAB+ v2 hat unten eine eigene Karte)
    entities:
      - entity: input_text.neuer_standort_name
        name: Ortsname
  - type: button
    entity: script.dvbt_scan_new_location
    name: DVB-T neuen Standort scannen (ca. 5-8 Min)
    icon: mdi:antenna
  - type: entities
    title: DVB-T Sender verwalten (aktives Netzwerk)
    entities:
      - entity: input_select.dvbt_sender_auswahl
        name: Sender auswaehlen
      - entity: sensor.dvb_t_sender_status_auswahl
        name: Status
      - entity: input_text.dvbt_sender_neuer_name
        name: Neuer Anzeigename
      - entity: script.dvbt_sender_ausschliessen
        name: Ausschliessen
        icon: mdi:television-off
      - entity: script.dvbt_sender_einschliessen
        name: Einschliessen
        icon: mdi:television
      - entity: script.dvbt_sender_umbenennen
        name: Umbenennen
        icon: mdi:rename
  - type: entities
    title: DVB-T Kanal verwalten (Nummer/Name/Aktiviert, sofortige Wirkung)
    entities:
      - entity: input_select.dvbt_kanal_auswahl
        name: Kanal auswaehlen
      - entity: sensor.dvb_t_kanal_status_auswahl
        name: Status
      - entity: input_text.dvbt_kanal_neuer_name
        name: Neuer Name
      - entity: script.dvbt_kanal_umbenennen
        name: Namen setzen
        icon: mdi:rename
      - entity: input_number.dvbt_kanal_neue_nummer
        name: Neue Nummer
      - entity: script.dvbt_kanal_nummer_setzen
        name: Nummer setzen
        icon: mdi:pound
      - entity: script.dvbt_kanal_aktivieren
        name: Aktivieren
        icon: mdi:television
      - entity: script.dvbt_kanal_deaktivieren
        name: Deaktivieren
        icon: mdi:television-off
  - type: markdown
    content: >
      ---

      ## DAB+ / FM v2 (API-nativ, kein mediaclient)

      Stationsliste/Scan laufen ueber die v2-Bridge, Cover-Art und
      Sendungsinfo (DLS) kommen direkt ueber die Sundtek-SDK. Das
      eigentliche Streaming ist wieder TVHeadends eigener pipe://ffmpeg
      pro Mux (wie v1) - eine Variante, in der die Bridge selbst den
      ffmpeg-Prozess haelt, erwies sich live als weniger stabil.
  - type: tile
    entity: sensor.dab_v2_scan_status
    name: DAB+ v2 Scan Status
  - type: entities
    title: DAB+ v2 Scan Details
    entities:
      - type: attribute
        entity: sensor.dab_v2_scan_status
        attribute: dab_scanning
        name: "DAB+ v2 Tuner-Scan läuft"
      - type: attribute
        entity: sensor.dab_v2_scan_status
        attribute: dab_scan_current_freq
        name: "DAB+ v2 Scan - aktuelle Frequenz"
      - type: attribute
        entity: sensor.dab_v2_scan_status
        attribute: dab_scan_current_stations
        name: "DAB+ v2 Scan - Sender bisher gefunden"
      - type: attribute
        entity: sensor.dab_v2_scan_status
        attribute: tvh_mux_scan_pending
        name: TVHeadend Mux-Scan ausstehend
      - type: attribute
        entity: sensor.dab_v2_scan_status
        attribute: tvh_mux_scan_active
        name: TVHeadend Mux-Scan aktiv
  - type: tile
    entity: sensor.dab_v2_sender_liste
    name: DAB+ v2 Senderanzahl
  - type: tile
    entity: sensor.dab_v2_aktiver_standort
    name: DAB+ v2 Aktiver Standort
  - type: entities
    title: DAB+ v2 Empfang (live)
    entities:
      - entity: sensor.dab_v2_ensemble
        name: Ensemble
      - entity: sensor.dab_v2_tuner_lock
        name: Tuner
      - type: attribute
        entity: sensor.dab_v2_ensemble
        attribute: rssi
        name: Signalstärke (RSSI)
      - type: attribute
        entity: sensor.dab_v2_ensemble
        attribute: snr
        name: SNR
      - type: attribute
        entity: sensor.dab_v2_ensemble
        attribute: frequency
        name: Frequenz (Hz)
      - type: attribute
        entity: sensor.dab_v2_ensemble
        attribute: sid
        name: SID
      - entity: sensor.dab_v2_aktueller_sender
        name: Aktueller Sender
      - entity: sensor.dab_v2_sendungsinfo_dls
        name: "Sendungsinfo (DLS)"
      - entity: sensor.dab_v2_sender_cover_status
        name: Cover Status
  - type: markdown
    content: >
      ### DAB+ v2 Sender Cover

      {% set now_playing = states('sensor.dab_v2_aktueller_sender') %}
      {% set available = state_attr('sensor.dab_v2_sender_cover_status', 'available') %}
      {% set cover_channel = state_attr('sensor.dab_v2_sender_cover_status', 'channel') %}
      {% set dls = states('sensor.dab_v2_sendungsinfo_dls') %}
      {% if not available or cover_channel != now_playing %}
      *Noch kein Cover für "{{ now_playing }}" empfangen.*
      {% else %}

      ![Cover]({{ state_attr('camera.dab_v2_sender_cover', 'entity_picture') }})

      {% endif %}

      **{{ dls }}**
  - type: entities
    title: DAB+ v2 Standort aktivieren
    entities:
      - entity: input_select.dab2_location_to_activate
        name: Gespeicherter Standort
  - type: button
    entity: script.dab2_activate_location
    name: DAB+ v2 Standort aktivieren
    icon: mdi:radio-tower
  - type: button
    entity: script.dab2_delete_location
    name: DAB+ v2 Standort loeschen
    icon: mdi:delete
    tap_action:
      action: call-service
      service: script.turn_on
      target:
        entity_id: script.dab2_delete_location
      confirmation:
        text: "Ausgewaehlten DAB+ v2-Standort wirklich loeschen? Das kann nicht rueckgaengig gemacht werden."
  - type: button
    entity: script.dab2_rescan
    name: DAB+ v2 neu scannen (ca. 2-3 Min)
    icon: mdi:radio-tower
  - type: entities
    title: DAB+ v2 neuen Standort scannen
    entities:
      - entity: input_text.neuer_standort_name
        name: Ortsname
  - type: button
    entity: script.dab2_scan_new_location
    name: DAB+ v2 neuen Standort scannen (ca. 2-3 Min)
    icon: mdi:radio-tower
  - type: entities
    title: DAB+ v2 Sender verwalten
    entities:
      - entity: input_select.dab2_sender_auswahl
        name: Sender auswaehlen
      - entity: input_text.dab2_sender_neuer_name
        name: Neuer Anzeigename
      - entity: script.dab2_sender_ausschliessen
        name: Ausschliessen
        icon: mdi:radio-off
      - entity: script.dab2_sender_einschliessen
        name: Einschliessen
        icon: mdi:radio
      - entity: script.dab2_sender_umbenennen
        name: Umbenennen
        icon: mdi:rename
  - type: tile
    entity: sensor.fm_v2_scan_status
    name: FM v2 Scan Status
  - type: entities
    title: FM v2 Scan Details
    entities:
      - type: attribute
        entity: sensor.fm_v2_scan_status
        attribute: fm_scanning
        name: "FM v2 Tuner-Scan läuft"
      - type: attribute
        entity: sensor.fm_v2_scan_status
        attribute: fm_scan_current_freq
        name: "FM v2 Scan - aktuelle Frequenz"
      - type: attribute
        entity: sensor.fm_v2_scan_status
        attribute: tvh_mux_scan_pending
        name: TVHeadend Mux-Scan ausstehend
      - type: attribute
        entity: sensor.fm_v2_scan_status
        attribute: tvh_mux_scan_active
        name: TVHeadend Mux-Scan aktiv
  - type: tile
    entity: sensor.fm_v2_sender_liste
    name: FM v2 Senderanzahl
  - type: tile
    entity: sensor.fm_v2_favoriten
    name: FM v2 Favoriten (eigene Sundtek-Liste)
  - type: tile
    entity: sensor.fm_v2_aktiver_standort
    name: FM v2 Aktiver Standort
  - type: entities
    title: FM v2 Empfang (live)
    entities:
      - entity: sensor.fm_v2_signalstaerke
        name: Signalstärke
      - entity: sensor.fm_v2_aktueller_sender
        name: Aktueller Sender
      - entity: sensor.fm_v2_rds_sendername
        name: RDS Sendername
      - type: attribute
        entity: sensor.fm_v2_rds_sendername
        attribute: radiotext
        name: RDS Radiotext
  - type: entities
    title: FM v2 Standort aktivieren
    entities:
      - entity: input_select.fm2_location_to_activate
        name: Gespeicherter Standort
  - type: button
    entity: script.fm2_activate_location
    name: FM v2 Standort aktivieren
    icon: mdi:radio-tower
  - type: button
    entity: script.fm2_delete_location
    name: FM v2 Standort loeschen
    icon: mdi:delete
    tap_action:
      action: call-service
      service: script.turn_on
      target:
        entity_id: script.fm2_delete_location
      confirmation:
        text: "Ausgewaehlten FM v2-Standort wirklich loeschen? Das kann nicht rueckgaengig gemacht werden."
  - type: button
    entity: script.fm2_rescan
    name: FM v2 neu scannen (ca. 2-3 Min)
    icon: mdi:radio-fm
  - type: entities
    title: FM v2 neuen Standort scannen
    entities:
      - entity: input_text.neuer_standort_name
        name: Ortsname
  - type: button
    entity: script.fm2_scan_new_location
    name: FM v2 neuen Standort scannen (ca. 2-3 Min)
    icon: mdi:radio-fm
  - type: entities
    title: FM v2 Sender verwalten
    entities:
      - entity: input_select.fm2_sender_auswahl
        name: Sender auswaehlen
      - entity: input_text.fm2_sender_neuer_name
        name: Neuer Anzeigename
      - entity: script.fm2_sender_ausschliessen
        name: Ausschliessen
        icon: mdi:radio-off
      - entity: script.fm2_sender_einschliessen
        name: Einschliessen
        icon: mdi:radio
      - entity: script.fm2_sender_umbenennen
        name: Umbenennen
        icon: mdi:rename

#
# WICHTIG bei eigener Anpassung: Home Assistant leitet die Entity-ID von
# REST-Sensoren/Automatisierungen vom Anzeigenamen ab, nicht von unique_id -
# z.B. wird "DVB-T Status" zu sensor.dvb_t_status (Bindestrich -> "_t_").
# Nach Aenderungen an "name:"-Feldern in den Packages immer unter
# Entwicklerwerkzeuge -> Zustaende nachschauen, wie die Entity wirklich
# heisst, statt vom Namen auszugehen.
